<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrototypeStudio Scroll Animation | Codegrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Google Sans", sans-serif;
        background-color: #141414;
        color: #fff;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      h1 {
        text-transform: uppercase;
        font-size: clamp(3rem, 5vw, 7rem);
        font-weight: 400;
        line-height: 1;
      }

      p {
        font-size: 1.5rem;
        font-weight: 500;
        line-height: 1.25;
      }

      section {
        position: relative;
        width: 100%;
        height: 100svh;
        padding: 2rem;
        overflow: hidden;
      }

      .intro,
      .outro {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .project-images {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 35%;
        padding: 50svh 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        z-index: -1;
      }

      .project-img {
        width: 100%;
        aspect-ratio: 16/9;
        opacity: 0.5;
        transition: all 0.3s ease;
        overflow: hidden;
      }

      .project-names {
        position: absolute;
        right: 2rem;
        bottom: 2rem;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .project-names p {
        color: #4a4a4a;
        transition: color 0.3s ease;
      }

      .project-index h1,
      .project-images,
      .project-names p {
        will-change: transform;
      }

      @media (max-width: 1000px) {
        .project-images {
          width: calc(100% - 4rem);
          gap: 25svh;
        }

        .project-names p {
          color: #fff !important;
        }
      }
    </style>
  </head>
  <body>
    <section class="intro">
      <p>A collection of selected works</p>
    </section>

    <section class="spotlight">
      <div class="project-index">
        <h1>01/04</h1>
      </div>

      <div class="project-images">
        <div class="project-img"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&h=450&fit=crop" alt="Human Form Study" /></div>
        <div class="project-img"><img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=800&h=450&fit=crop" alt="Shadow Portraits" /></div>
        <div class="project-img"><img src="https://images.unsplash.com/photo-1500462918059-b1a0cb512f1d?w=800&h=450&fit=crop" alt="Motion Practice" /></div>
        <div class="project-img"><img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=800&h=450&fit=crop" alt="Quiet Walk" /></div>
      </div>

      <div class="project-names">
        <p>Human Form Study</p>
        <p>Shadow Portraits</p>
        <p>Motion Practice</p>
        <p>Quiet Walk</p>
      </div>
    </section>

    <section class="outro">
      <p>Scroll complete</p>
    </section>

    <!-- GSAP + ScrollTrigger + Lenis via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

    <script type="module">
      gsap.registerPlugin(ScrollTrigger);

      document.addEventListener("DOMContentLoaded", () => {
        const lenis = new Lenis();
        lenis.on("scroll", ScrollTrigger.update);
        gsap.ticker.add((time) => {
          lenis.raf(time * 1000);
        });
        gsap.ticker.lagSmoothing(0);

        const spotlightSection = document.querySelector(".spotlight");
        const projectIndex = document.querySelector(".project-index h1");
        const projectImgs = document.querySelectorAll(".project-img");
        const projectImagesContainer = document.querySelector(".project-images");
        const projectNames = document.querySelectorAll(".project-names p");
        const projectNamesContainer = document.querySelector(".project-names");
        const totalProjectCount = projectNames.length;

        const spotlightSectionHeight = spotlightSection.offsetHeight;
        const spotlightSectionPadding = parseFloat(
          getComputedStyle(spotlightSection).padding
        );
        const projectIndexHeight = projectIndex.offsetHeight;
        const containerHeight = projectNamesContainer.offsetHeight;
        const imagesHeight = projectImagesContainer.offsetHeight;

        const moveDistanceIndex =
          spotlightSectionHeight - spotlightSectionPadding * 2 - projectIndexHeight;
        const moveDistanceNames =
          spotlightSectionHeight - spotlightSectionPadding * 2 - containerHeight;
        const moveDistanceImages = window.innerHeight - imagesHeight;

        const imgActivationThreshold = window.innerHeight / 2;

        ScrollTrigger.create({
          trigger: ".spotlight",
          start: "top top",
          end: `+=${window.innerHeight * 5}px`,
          pin: true,
          pinSpacing: true,
          scrub: 1,
          onUpdate: (self) => {
            const progress = self.progress;
            const currentIndex = Math.min(
              Math.floor(progress * totalProjectCount) + 1,
              totalProjectCount
            );

            projectIndex.textContent = `${String(currentIndex).padStart(2, "0")}/${String(totalProjectCount).padStart(2, "0")}`;

            gsap.set(projectIndex, {
              y: progress * moveDistanceIndex,
            });

            gsap.set(projectImagesContainer, {
              y: progress * moveDistanceImages,
            });

            projectImgs.forEach((img) => {
              const imgRect = img.getBoundingClientRect();
              const imgTop = imgRect.top;
              const imgBottom = imgRect.bottom;

              if (
                imgTop <= imgActivationThreshold &&
                imgBottom >= imgActivationThreshold
              ) {
                gsap.set(img, {
                  opacity: 1,
                });
              } else {
                gsap.set(img, {
                  opacity: 0.5,
                });
              }
            });

            projectNames.forEach((p, index) => {
              const startProgress = index / totalProjectCount;
              const endProgress = (index + 1) / totalProjectCount;
              const projectProgress = Math.max(
                0,
                Math.min(
                  1,
                  (progress - startProgress) / (endProgress - startProgress)
                )
              );

              gsap.set(p, {
                y: -projectProgress * moveDistanceNames,
              });

              if (projectProgress > 0 && projectProgress < 1) {
                gsap.set(p, {
                  color: "#fff",
                });
              } else {
                gsap.set(p, {
                  color: "#4a4a4a",
                });
              }
            });
          },
        });
      });
    </script>
  </body>
</html>
