<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glyph Dither</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; font-family:monospace; }
    #wrap { position:relative; cursor:none; }
    canvas { display:block; }

    /* ── Panel ── */
    #panel {
      position:fixed; top:0; right:0; bottom:0;
      width:270px;
      background:rgba(12,12,12,0.97);
      border-left:1px solid #1e1e1e;
      overflow-y:auto;
      padding:1.2rem 1rem;
      z-index:20;
    }
    #panel h2 {
      font-size:10px; letter-spacing:.2em; text-transform:uppercase;
      color:#555; margin-bottom:1rem;
    }
    .section-title {
      font-size:9px; letter-spacing:.18em; text-transform:uppercase;
      color:#9b59e8; margin:1rem 0 .6rem; display:block;
    }
    .row {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:9px;
    }
    .row label { font-size:11px; color:#666; flex:1; }
    .row input[type=range] {
      width:90px; accent-color:#9b59e8; flex-shrink:0;
    }
    .val {
      font-size:11px; color:#c8c8c8;
      min-width:28px; text-align:right; flex-shrink:0;
    }
    .row input[type=text] {
      width:100px; background:#0e0e0e; border:1px solid #252525;
      color:#c8c8c8; padding:3px 6px; border-radius:3px;
      font-family:monospace; font-size:11px;
    }
    .row select {
      width:106px; background:#0e0e0e; border:1px solid #252525;
      color:#c8c8c8; padding:3px 5px; border-radius:3px; font-size:11px;
    }
    .row input[type=checkbox] { accent-color:#9b59e8; width:14px; height:14px; }
    .sep { border-top:1px solid #181818; margin:10px 0; }

    /* ── Button groups ── */
    .btn-group {
      display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px;
    }
    .btn-group button {
      flex:1; min-width:0;
      background:#0e0e0e; border:1px solid #2a2a2a; color:#666;
      font-family:monospace; font-size:10px; padding:5px 3px;
      border-radius:3px; cursor:pointer; text-align:center;
      transition:border-color .15s,color .15s,background .15s;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .btn-group button:hover { border-color:#9b59e8; color:#c8c8c8; }
    .btn-group button.active { border-color:#e8c93a; color:#e8c93a; background:#1a1800; }

    /* ── Invert row ── */
    .invert-row {
      display:flex; align-items:center; justify-content:flex-end;
      gap:6px; margin-bottom:8px;
    }
    .invert-row label { font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#555; }
    .invert-row input[type=checkbox] { accent-color:#9b59e8; width:13px; height:13px; }

    /* ── Custom color sliders ── */
    #custom-colors { margin-top:4px; }
    .color-row { display:flex; align-items:center; gap:5px; margin-bottom:6px; }
    .color-row label { font-size:10px; color:#555; width:14px; flex-shrink:0; }
    .color-row input[type=range] { flex:1; accent-color:#9b59e8; }
    .color-row .val { font-size:10px; color:#c8c8c8; min-width:24px; text-align:right; }
    .color-swatch { width:12px; height:12px; border-radius:2px; border:1px solid #333; flex-shrink:0; }

    #upload-btn {
      display:block; width:100%; margin-top:1rem;
      background:#0e0e0e; border:1px solid #2a2a2a; color:#666;
      font-family:monospace; font-size:11px; padding:7px;
      border-radius:4px; cursor:pointer; text-align:center;
      transition:border-color .2s,color .2s;
    }
    #upload-btn:hover { border-color:#9b59e8; color:#c8c8c8; }
  </style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="panel">
  <h2>⁂ Glyph Dither</h2>

  <!-- ── COLOR MODE ── -->
  <span class="section-title">Color Mode</span>
  <div class="invert-row">
    <label>Invert Color</label>
    <input type="checkbox" id="p-invertcolor">
  </div>
  <div class="btn-group" id="colormode-group">
    <button data-cm="mono">Grayscale</button>
    <button class="active" data-cm="texture">Full Color</button>
    <button data-cm="matrix">Matrix Green</button>
    <button data-cm="amber">Amber Monitor</button>
    <button data-cm="custom">Custom</button>
  </div>
  <div id="custom-colors" style="display:none;">
    <div class="color-row">
      <label style="color:#f55;">R</label>
      <input type="range" id="p-cr" min="0" max="255" value="255">
      <span class="val" id="v-cr">255</span>
    </div>
    <div class="color-row">
      <label style="color:#5f5;">G</label>
      <input type="range" id="p-cg" min="0" max="255" value="255">
      <span class="val" id="v-cg">255</span>
    </div>
    <div class="color-row">
      <label style="color:#55f;">B</label>
      <input type="range" id="p-cb" min="0" max="255" value="255">
      <span class="val" id="v-cb">255</span>
    </div>
    <div class="color-row">
      <label style="color:#888;">Br</label>
      <input type="range" id="p-cbright" min="0" max="200" value="100">
      <span class="val" id="v-cbright">100</span>
    </div>
    <div class="color-row">
      <label style="color:#888;">Co</label>
      <input type="range" id="p-ccontrast" min="0" max="200" value="100">
      <span class="val" id="v-ccontrast">100</span>
    </div>
  </div>

  <div class="sep"></div>
  <span class="section-title">Glyph</span>
  <div class="row">
    <label>Characters</label>
    <input type="text" id="p-chars" value=".;:-=+*#%@">
  </div>
  <div class="row">
    <label>Scale</label>
    <input type="range" id="p-scale" min="20" max="200" value="62">
    <span class="val" id="v-scale">62</span>
  </div>
  <div class="row">
    <label>Gamma</label>
    <input type="range" id="p-gamma" min="1" max="200" value="21">
    <span class="val" id="v-gamma">21</span>
  </div>
  <div class="row">
    <label>Phase</label>
    <input type="range" id="p-phase" min="0" max="360" value="0">
    <span class="val" id="v-phase">0</span>
  </div>
  <div class="row">
    <label>Invert order</label>
    <input type="checkbox" id="p-invert">
  </div>

  <div class="sep"></div>
  <span class="section-title">Mouse Trail</span>
  <div class="row">
    <label>Radius</label>
    <input type="range" id="p-radius" min="1" max="20" value="5.4" step="0.1">
    <span class="val" id="v-radius">5.4</span>
  </div>
  <div class="row">
    <label>Strength</label>
    <input type="range" id="p-strength" min="0" max="100" value="2">
    <span class="val" id="v-strength">2</span>
  </div>
  <div class="row">
    <label>Hardness</label>
    <input type="range" id="p-hardness" min="0" max="100" value="12">
    <span class="val" id="v-hardness">12</span>
  </div>
  <div class="row">
    <label>Tail</label>
    <input type="range" id="p-tail" min="0" max="100" value="59">
    <span class="val" id="v-tail">59</span>
  </div>
  <div class="row">
    <label>Fluidity</label>
    <input type="range" id="p-fluidity" min="0" max="100" value="19">
    <span class="val" id="v-fluidity">19</span>
  </div>
  <div class="row">
    <label>Dissipation</label>
    <input type="range" id="p-dissipation" min="0" max="100" value="0">
    <span class="val" id="v-dissipation">0</span>
  </div>
  <div class="row">
    <label>Momentum</label>
    <input type="range" id="p-momentum" min="0" max="100" value="0">
    <span class="val" id="v-momentum">0</span>
  </div>

  <div class="sep"></div>
  <span class="section-title">Effect — Noise Displace</span>
  <div class="row">
    <label>Scale</label>
    <input type="range" id="p-nscale" min="1" max="100" value="7">
    <span class="val" id="v-nscale">7</span>
  </div>
  <div class="row">
    <label>Speed</label>
    <input type="range" id="p-nspeed" min="0" max="100" value="48">
    <span class="val" id="v-nspeed">48</span>
  </div>
  <div class="row">
    <label>Amplitude</label>
    <input type="range" id="p-namp" min="0" max="100" value="11">
    <span class="val" id="v-namp">11</span>
  </div>


  <div class="sep"></div>
  <span class="section-title">Parallax</span>
  <div class="row">
    <label>Depth</label>
    <input type="range" id="p-parallax" min="0" max="80" value="30">
    <span class="val" id="v-parallax">30</span>
  </div>

  <div class="sep"></div>
  <button id="upload-btn" onclick="document.getElementById('file-in').click()">Upload image</button>
  <input type="file" id="file-in" accept="image/*">
</div>

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('wrap');
const dpr    = window.devicePixelRatio || 1;
const PANEL_W = 270;

let SIZE=0, COLS=0, ROWS=0, CW=0, CH=0;
let cells=[], fieldVX=null, fieldVY=null;
let mouseX=0, mouseY=0, smMX=0, smMY=0, prevMX=0, prevMY=0;
let img=null;
// Parallax
let prlxX=0, prlxY=0;

// Live params
const P = {
  chars:'.;:-=+*#%@', scale:62, gamma:21, phase:0,
  colormode:'texture', invert:false,
  invertcolor:false,
  radius:5.4, strength:2, hardness:12, tail:59,
  fluidity:19, dissipation:0, momentum:0,
  nscale:7, nspeed:48, namp:11,
  // Custom color
  cr:255, cg:255, cb:255, cbright:100, ccontrast:100,
  // Parallax
  parallax:30
};

// ── Bind all sliders ─────────────────────────────────
function bindRange(id, key, rebuild) {
  const el=document.getElementById(id);
  const ve=document.getElementById('v-'+key);
  el.addEventListener('input', () => {
    P[key] = +el.value;
    if(ve) ve.textContent = el.value;
    if(rebuild && img) buildSamples(img);
  });
}
function bindCheck(id, key) {
  document.getElementById(id).addEventListener('change', e => {
    P[key] = e.target.checked;
    if(img) buildSamples(img);
  });
}
function bindSelect(id, key) {
  document.getElementById(id).addEventListener('change', e => {
    P[key] = e.target.value;
  });
}
document.getElementById('p-chars').addEventListener('input', e => {
  P.chars = e.target.value || ' ';
  if(img) buildSamples(img);
});

bindRange('p-scale',       'scale',       true);
bindRange('p-gamma',       'gamma',       true);
bindRange('p-phase',       'phase',       true);
bindRange('p-radius',      'radius',      false);
bindRange('p-strength',    'strength',    false);

bindRange('p-momentum',    'momentum',    false);

// ── Noise ────────────────────────────────────────────
function hash(x,y) {
  let h=(Math.imul(x,374761393)+Math.imul(y,668265263))>>>0;
  h=Math.imul(h^(h>>>13),1274126177)>>>0;
  return (h^(h>>>16))/4294967296;
}
function smoothNoise(x,y) {
  const ix=Math.floor(x),iy=Math.floor(y);
  const fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return hash(ix,iy)*(1-ux)*(1-uy)+hash(ix+1,iy)*ux*(1-uy)+hash(ix,iy+1)*(1-ux)*uy+hash(ix+1,iy+1)*ux*uy;
}
function fbm(x,y) {
  return smoothNoise(x,y)*0.5+smoothNoise(x*2,y*2)*0.3+smoothNoise(x*4,y*4)*0.2;
}

// ── Build glyph grid ─────────────────────────────────
function buildSamples(image) {
  const avail = window.innerWidth - PANEL_W;
  SIZE = Math.round(Math.min(avail, window.innerHeight) * 0.96);

  canvas.width  = SIZE*dpr; canvas.height = SIZE*dpr;
  canvas.style.width=SIZE+'px'; canvas.style.height=SIZE+'px';
  wrap.style.width=SIZE+'px'; wrap.style.height=SIZE+'px';

  const fontSize = Math.max(5, Math.round(P.scale*0.13));
  const mc=document.createElement('canvas').getContext('2d');
  mc.font=fontSize+'px monospace';
  CW=Math.ceil(mc.measureText('M').width); CH=fontSize;
  COLS=Math.floor(SIZE/CW); ROWS=Math.floor(SIZE/CH);

  const sc=document.createElement('canvas');
  sc.width=COLS; sc.height=ROWS;
  const sCtx=sc.getContext('2d');
  const iw=image.naturalWidth,ih=image.naturalHeight;
  let sx=0,sy=0,sw=iw,sh=ih;
  if(iw/ih>1){sw=ih;sx=(iw-sw)/2;}else{sh=iw;sy=(ih-sh)/2;}
  sCtx.drawImage(image,sx,sy,sw,sh,0,0,COLS,ROWS);
  const d=sCtx.getImageData(0,0,COLS,ROWS).data;

  const chars=P.chars||' ';
  cells=[];
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      const i=(r*COLS+c)*4;
      const ri=d[i],gi=d[i+1],bi=d[i+2];
      let b=(ri*0.299+gi*0.587+bi*0.114)/255;
      b=Math.pow(b,P.gamma/63);
      b+=Math.sin((c+r)*0.18+P.phase*Math.PI/180)*0.04;
      b=Math.max(0,Math.min(1,b));
      if(P.invert) b=1-b;
      const char=chars[Math.min(chars.length-1,Math.floor(b*chars.length))];
      cells.push({bx:c*CW,by:r*CH,char,ri,gi,bi});
    }
  }

  fieldVX=new Float32Array(COLS*ROWS);
  fieldVY=new Float32Array(COLS*ROWS);
  mouseX=smMX=prevMX=SIZE/2;
  mouseY=smMY=prevMY=SIZE/2;
}

// ── Trail update ─────────────────────────────────────
function updateTrail() {
  if(!fieldVX) return;

  // momentum = mouse lag
  const lag = P.momentum/100;
  smMX += (mouseX-smMX)*(1-lag*0.9);
  smMY += (mouseY-smMY)*(1-lag*0.9);

  const mvx=smMX-prevMX, mvy=smMY-prevMY;
  prevMX=smMX; prevMY=smMY;

  // fluidity: smooth the velocity
  const fluidSmooth = P.fluidity/100;

  // radius in pixels
  const R = Math.max(2, P.radius*(SIZE/100)*3.5);
  const str = P.strength*0.25;

  const mcol=Math.floor(smMX/CW), mrow=Math.floor(smMY/CH);
  const ri=Math.ceil(R/CW);

  for(let dr=-ri;dr<=ri;dr++) {
    for(let dc=-ri;dc<=ri;dc++) {
      const col=mcol+dc, row=mrow+dr;
      if(col<0||col>=COLS||row<0||row>=ROWS) continue;
      const cx=col*CW+CW/2, cy=row*CH+CH/2;
      const dx=cx-smMX, dy=cy-smMY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const t=dist/R;
      // hardness controls falloff sharpness
      const h=P.hardness/100;
      const softFall = t<1?(Math.cos(t*Math.PI)*0.5+0.5):0;
      const hardFall = t<1?(1-t):0;
      const falloff  = softFall*(1-h)+hardFall*h;
      if(falloff<=0) continue;
      const idx=row*COLS+col;
      const addX=mvx*falloff*str;
      const addY=mvy*falloff*str;
      // fluidity blends new vs accumulated
      fieldVX[idx]=fieldVX[idx]*fluidSmooth + addX*(1-fluidSmooth) + addX;
      fieldVY[idx]=fieldVY[idx]*fluidSmooth + addY*(1-fluidSmooth) + addY;
    }
  }

  // Tail decay
  const tailDecay = 0.92 + (P.tail/100)*0.079;
  // Dissipation (spreads to neighbours)
  const diss = P.dissipation/100*0.15;

  for(let i=0;i<fieldVX.length;i++) {
    fieldVX[i]*=tailDecay;
    fieldVY[i]*=tailDecay;
  }

  if(diss>0) {
    const tmp=new Float32Array(fieldVX.length);
    const tmpy=new Float32Array(fieldVY.length);
    for(let r=1;r<ROWS-1;r++) {
      for(let c=1;c<COLS-1;c++) {
        const i=r*COLS+c;
        const avg=(fieldVX[i-1]+fieldVX[i+1]+fieldVX[i-COLS]+fieldVX[i+COLS])/4;
        tmp[i]=fieldVX[i]*(1-diss)+avg*diss;
        const avgy=(fieldVY[i-1]+fieldVY[i+1]+fieldVY[i-COLS]+fieldVY[i+COLS])/4;
        tmpy[i]=fieldVY[i]*(1-diss)+avgy*diss;
      }
    }
    fieldVX.set(tmp); fieldVY.set(tmpy);
  }
}

// ── Render ────────────────────────────────────────────
let t0=performance.now();
function render() {
  requestAnimationFrame(render);
  if(!cells.length||!fieldVX) return;

  updateTrail();

  // ── Parallax ──────────────────────────────────────────
  // Normalize mouse to -1..1 relative to canvas center
  const normX = (mouseX / SIZE - 0.5) * 2;
  const normY = (mouseY / SIZE - 0.5) * 2;
  // Smooth toward target (lerp speed 0.06 = nice and lazy)
  prlxX += (normX - prlxX) * 0.06;
  prlxY += (normY - prlxY) * 0.06;
  const px = prlxX * P.parallax;
  const py = prlxY * P.parallax;

  const t=(performance.now()-t0)*0.001;
  const ns=P.nscale*0.003;
  const spd=P.nspeed*0.0004;
  const amp=P.namp*0.18;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,SIZE,SIZE);
  ctx.font=CH+'px monospace';
  ctx.textBaseline='top';

  for(let i=0;i<cells.length;i++) {
    const cell=cells[i];
    const col=i%COLS, row=Math.floor(i/COLS);

    // Noise displace
    const nx=fbm(col*ns+t*spd,       row*ns+0.3);
    const ny=fbm(col*ns+0.7+t*spd*0.8, row*ns+1.1+t*spd*0.6);
    const ndx=(nx-0.5)*2*amp;
    const ndy=(ny-0.5)*2*amp;

    // Trail
    const idx=row*COLS+col;
    const x=cell.bx+ndx+fieldVX[idx]+px;
    const y=cell.by+ndy+fieldVY[idx]+py;

    if(P.colormode==='texture') {
      let ri=cell.ri,gi=cell.gi,bi=cell.bi;
      if(P.invertcolor){ri=255-ri;gi=255-gi;bi=255-bi;}
      ctx.fillStyle=`rgb(${ri},${gi},${bi})`;
    } else if(P.colormode==='mono') {
      let v=Math.round((cell.ri*0.299+cell.gi*0.587+cell.bi*0.114));
      if(P.invertcolor) v=255-v;
      ctx.fillStyle=`rgb(${v},${v},${v})`;
    } else if(P.colormode==='matrix') {
      let v=Math.round((cell.ri*0.299+cell.gi*0.587+cell.bi*0.114));
      if(P.invertcolor) v=255-v;
      ctx.fillStyle=`rgb(0,${v},${Math.round(v*0.2)})`;
    } else if(P.colormode==='amber') {
      let v=Math.round((cell.ri*0.299+cell.gi*0.587+cell.bi*0.114));
      if(P.invertcolor) v=255-v;
      ctx.fillStyle=`rgb(${Math.round(v*1.0)},${Math.round(v*0.55)},0)`;
    } else if(P.colormode==='warm') {
      let v=Math.round(cell.ri*0.8+cell.gi*0.1);
      if(P.invertcolor) v=255-v;
      ctx.fillStyle=`rgb(${v},${Math.round(v*0.6)},${Math.round(v*0.3)})`;
    } else if(P.colormode==='custom') {
      let lum=(cell.ri*0.299+cell.gi*0.587+cell.bi*0.114)/255;
      // brightness & contrast
      lum=((lum-0.5)*(P.ccontrast/100)+0.5)*(P.cbright/100);
      lum=Math.max(0,Math.min(1,lum));
      if(P.invertcolor) lum=1-lum;
      const r=Math.round(P.cr*lum);
      const g=Math.round(P.cg*lum);
      const b=Math.round(P.cb*lum);
      ctx.fillStyle=`rgb(${r},${g},${b})`;
    }
    ctx.fillText(cell.char,x,y);
  }
}

// ── Events ────────────────────────────────────────────
wrap.addEventListener('mousemove',e=>{
  const r=wrap.getBoundingClientRect();
  mouseX=e.clientX-r.left; mouseY=e.clientY-r.top;
});
wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=wrap.getBoundingClientRect(),t=e.touches[0];
  mouseX=t.clientX-r.left; mouseY=t.clientY-r.top;
},{passive:false});
window.addEventListener('resize',()=>{ if(img) buildSamples(img); });

// ── Boot ──────────────────────────────────────────────
const startImg=new Image();
startImg.onload=()=>{ img=startImg; buildSamples(img); };
startImg.src=IMG_SRC;
render();
</script>
